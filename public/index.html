<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Manajemen Perpustakaan Firebase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        📚 E-Perpustakaan Cloud
      </h1>
      <span class="text-sm bg-indigo-500 px-3 py-1 rounded-full">Vercel & Firebase</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">
    
    <!-- Form Tambah Buku -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-semibold mb-4 text-slate-700">Tambah Buku Baru</h2>
      <form id="bookForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">Judul Buku</label>
          <input type="text" id="title" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300" placeholder="Masukkan judul buku">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">Penulis</label>
          <input type="text" id="author" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300" placeholder="Nama penulis">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">Tahun Terbit</label>
          <input type="number" id="year" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300" placeholder="2026">
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-600">Kategori</label>
          <select id="category" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border-slate-300">
            <option value="Fiksi">Fiksi</option>
            <option value="Non-Fiksi">Non-Fiksi</option>
            <option value="Teknologi">Teknologi</option>
            <option value="Sains">Sains</option>
            <option value="Sejarah">Sejarah</option>
          </select>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg transition duration-200">
          Simpan Buku
        </button>
      </form>
    </section>

    <!-- Daftar Buku -->
    <section class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-slate-700">Daftar Koleksi Buku</h2>
        <span id="bookCount" class="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">0 Buku</span>
      </div>
      
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500 text-sm">
              <th class="py-3 px-2">Judul</th>
              <th class="py-3 px-2">Penulis</th>
              <th class="py-3 px-2">Tahun</th>
              <th class="py-3 px-2">Kategori</th>
              <th class="py-3 px-2 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="bookList" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-400">Memuat data dari database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const bookForm = document.getElementById('bookForm');
    const bookList = document.getElementById('bookList');
    const bookCount = document.getElementById('bookCount');

    // Fungsi Fetch untuk Mengambil Data Buku dari API
    async function fetchBooks() {
      try {
        const response = await fetch('/api');
        const result = await response.json();
        
        if (result.success) {
          renderBooks(result.data);
        } else {
          bookList.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-400">Gagal memuat data buku.</td></tr>`;
        }
      } catch (error) {
        console.error('Error fetching books:', error);
        bookList.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-red-400">Terjadi kesalahan koneksi server.</td></tr>`;
      }
    }

    // Render Data ke Tabel HTML
    function renderBooks(books) {
      bookList.innerHTML = '';
      
      if (books.length === 0) {
        bookList.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-slate-400">Belum ada buku tersimpan di database.</td></tr>`;
      } else {
        books.forEach(book => {
          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50 transition';
          row.innerHTML = `
            <td class="py-3 px-2 font-medium text-slate-800">${escapeHtml(book.title || '')}</td>
            <td class="py-3 px-2 text-slate-600">${escapeHtml(book.author || '')}</td>
            <td class="py-3 px-2 text-slate-600">${book.year || '-'}</td>
            <td class="py-3 px-2">
              <span class="bg-slate-100 text-slate-700 text-xs px-2 py-1 rounded font-medium">${escapeHtml(book.category || 'Umum')}</span>
            </td>
            <td class="py-3 px-2 text-center">
              <button onclick="deleteBook('${book.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs bg-red-50 hover:bg-red-100 px-2.5 py-1 rounded transition">
                Hapus
              </button>
            </td>
          `;
          bookList.appendChild(row);
        });
      }
      bookCount.textContent = `${books.length} Buku`;
    }

    // Event Listener untuk Menambah Buku (POST)
    bookForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      
      const newBook = {
        title: document.getElementById('title').value.trim(),
        author: document.getElementById('author').value.trim(),
        year: document.getElementById('year').value,
        category: document.getElementById('category').value
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';

      try {
        const response = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newBook)
        });
        
        const result = await response.json();
        if (result.success) {
          bookForm.reset();
          fetchBooks();
        } else {
          alert('Gagal menyimpan: ' + result.message);
        }
      } catch (error) {
        console.error('Error adding book:', error);
        alert('Terjadi kesalahan saat menyimpan buku.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Simpan Buku';
      }
    });

    // Fungsi Menghapus Buku (DELETE)
    async function deleteBook(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus buku ini?')) return;

      try {
        const response = await fetch(`/api?id=${id}`, { method: 'DELETE' });
        const result = await response.json();
        
        if (result.success) {
          fetchBooks();
        } else {
          alert('Gagal menghapus: ' + result.message);
        }
      } catch (error) {
        console.error('Error deleting book:', error);
        alert('Terjadi kesalahan saat menghapus buku.');
      }
    }

    // Security Helper untuk mencegah XSS
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Muat data saat halaman pertama kali dibuka
    document.addEventListener('DOMContentLoaded', fetchBooks);
  </script>
</body>
</html>
